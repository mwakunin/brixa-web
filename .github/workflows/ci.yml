name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes anything, so the token can do nothing but read.
permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, not tags, as in the API repo: a tag like
# v4 is mutable and the upstream owner can repoint it. The trailing comment
# records which release each SHA was.
jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing in this workflow talks to git over the network, so the
          # job's token is not left in .git/config for later steps.
          persist-credentials: false

      # Must come before setup-node: its pnpm cache needs pnpm on PATH.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite pins TZ itself, so a UTC runner does not make the Nairobi
      # date tests vacuous.
      - name: Test
        run: pnpm test

  build:
    name: production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No page fetches at build time: every screen is behind sign-in and
      # reads the API from the browser. So the build needs no API to talk to.
      - name: Build
        run: pnpm build
